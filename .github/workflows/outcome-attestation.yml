name: Outcome Attestation Experiment

on:
  push:
    branches:
      - experiment/outcome-attestation-v0
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run adversarial prototype tests
        run: python -m unittest experiments.outcome_attestation.test_attestor -v
